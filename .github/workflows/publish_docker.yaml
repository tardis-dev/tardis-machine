name: Publish Existing Version To Docker Hub

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published tardis-machine npm version
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish Existing Version To Docker Hub
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: tardisdev/tardis-machine
      NPM_CONFIG_MIN_RELEASE_AGE: 0

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Use Node.js v25.8.2
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 25.8.2

      - name: Verify Published NPM Version
        env:
          VERSION: ${{ inputs.version }}
        run: test "$(npm view "tardis-machine@$VERSION" version)" = "$VERSION"

      - name: Set Up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Login To Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build And Push Docker Image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION_ARG=${{ inputs.version }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ inputs.version }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Logout From Docker Hub
        run: docker logout
        if: ${{ always() }}
        continue-on-error: true
