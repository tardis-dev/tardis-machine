name: Publish Existing Version To Docker Hub

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published bundled tardis-machine npm version
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish Existing Version To Docker Hub
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: tardisdev/tardis-machine

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js v26.7.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
          package-manager-cache: false

      - name: Download Published Package
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir publish-artifact
          for attempt in $(seq 1 60); do
            if npm pack "tardis-machine@$VERSION" --ignore-scripts --pack-destination publish-artifact --min-release-age-exclude=tardis-machine --allow-remote=all; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              exit 1
            fi
            sleep 10
          done
          mv publish-artifact/*.tgz publish-artifact/tardis-machine.tgz
          tar -tzf publish-artifact/tardis-machine.tgz package/node_modules/tardis-dev/package.json > /dev/null

      - name: Set Up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login To Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build And Push Docker Image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ inputs.version }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Logout From Docker Hub
        run: docker logout
        if: ${{ always() }}
        continue-on-error: true
