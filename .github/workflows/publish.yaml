name: Publish New Release To NPM And Image To Docker Hub

on:
  release:
    types: [published]

permissions: {}

jobs:
  build:
    name: Build And Pack Release
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Release Tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate Release Tag
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_VERSION: ${{ github.event.release.tag_name }}
        run: |
          if [[ "$RELEASE_VERSION" == v* ]]; then
            echo "Release tag must be a plain semver version without a v prefix: $RELEASE_VERSION" >&2
            exit 1
          fi

          release_commit=$(git rev-parse HEAD)
          if ! git merge-base --is-ancestor "$release_commit" "origin/${DEFAULT_BRANCH}"; then
            echo "Release tag must point to a commit in the ${DEFAULT_BRANCH} history." >&2
            exit 1
          fi

      - name: Use Node.js v26.7.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
          package-manager-cache: false

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Verify Registry Signatures
        run: npm audit signatures

      - name: Audit Dependencies
        run: npm audit --package-lock-only --audit-level=high

      - name: Set Package Version
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name }}
        run: npm version "$RELEASE_VERSION" --no-git-tag-version --ignore-scripts

      - name: Run Tests
        run: npm test

      - name: Create npm Tarball
        run: |
          mkdir publish-artifact
          npm pack --ignore-scripts --pack-destination publish-artifact
          mv publish-artifact/*.tgz publish-artifact/tardis-machine.tgz

      - name: Upload Package Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: publish-artifact/tardis-machine.tgz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish-npm:
    name: Publish Package To NPM
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Use Node.js v26.7.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
          registry-url: https://registry.npmjs.org/

      - name: Download Package Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: publish-artifact

      - name: Publish Package
        run: npm publish ./publish-artifact/tardis-machine.tgz --ignore-scripts

  update-version:
    name: Commit Package Version
    needs: publish-npm
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Use Node.js v26.7.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
          package-manager-cache: false

      - name: Checkout Default Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Commit Package Version
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_VERSION: ${{ github.event.release.tag_name }}
        run: |
          git config user.name "GitHub Release Bot"
          git config user.email "deploy@tardis.dev"
          npm version "$RELEASE_VERSION" --no-git-tag-version --ignore-scripts
          git add package.json package-lock.json
          git commit -m "$RELEASE_VERSION"
          git push origin "HEAD:${DEFAULT_BRANCH}"

  publish-docker:
    name: Publish Image To Docker Hub
    needs: update-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IMAGE_NAME: tardisdev/tardis-machine

    steps:
      - name: Checkout Release Tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Download Package Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: publish-artifact

      - name: Set Up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login To Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build And Push Docker Image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.event.release.tag_name }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Logout From Docker Hub
        run: docker logout
        if: ${{ always() }}
        continue-on-error: true
